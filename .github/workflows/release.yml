name: Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # `prepack` builds with pnpm, so packing and publishing both need the
      # toolchain installed, not just the runtime.
      - run: pnpm install --frozen-lockfile
      - name: Verify release payload
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== `v${pkg.version}`) {
            throw new Error(`tag ${process.env.GITHUB_REF_NAME} does not match package version ${pkg.version}`)
          }
          const client = readFileSync('lib/client.cjs', 'utf8')
          const inject = 'await ctx.inject(["remote.pluginMarketGithub"]'
          const mount = 'function mountMarketplace(ctx, config)'
          if (!client.includes(inject) || !client.includes(mount)) {
            throw new Error('client bundle does not wait for the GitHub Remote namespace')
          }
          NODE
          npm pack --dry-run
      - run: pnpm test

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Students install from the git tag, so the GitHub release comes first:
      # a registry credential this repository cannot fix must not cost them the
      # release. The npm step still fails the run, keeping that visible.
      - name: Create GitHub release
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '/^## / { if (found) exit; if ($2 == version) { found=1; next } } found { print }' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file release-notes.md --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Report a skipped npm publish
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "::warning::NPM_TOKEN is not set, so ${GITHUB_REF_NAME} reached GitHub only."
      - name: Publish to npm
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --provenance --access public
