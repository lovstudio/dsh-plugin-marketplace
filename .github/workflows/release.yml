name: Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # `prepack` builds with pnpm, so packing and publishing both need the
      # toolchain installed, not just the runtime.
      - run: pnpm install --frozen-lockfile
      - name: Verify release payload
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== `v${pkg.version}`) {
            throw new Error(`tag ${process.env.GITHUB_REF_NAME} does not match package version ${pkg.version}`)
          }
          const client = readFileSync('lib/client.cjs', 'utf8')
          const inject = 'await ctx.inject(["remote.pluginMarketGithub"]'
          const mount = 'function mountMarketplace(ctx, config)'
          if (!client.includes(inject) || !client.includes(mount)) {
            throw new Error('client bundle does not wait for the GitHub Remote namespace')
          }
          NODE
          npm pack --dry-run

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Students install from the git tag, so a missing npm credential must not
      # cost them the release. Skip the registry and say so instead.
      - name: Publish to npm
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --provenance --access public
      - name: Report a skipped npm publish
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "::warning::NPM_TOKEN is not set, so ${GITHUB_REF_NAME} reached GitHub only."
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
